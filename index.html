<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Планировщик хлеба на закваске</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Хлеб">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf6f0;--fg:#2b2119;--card:#fff;--mut:#7a6b5d;--bd:#e6dccf;--ac:#a8642a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1712;--fg:#f1e8dc;--card:#272019;--mut:#a89886;--bd:#3a3026;--ac:#e0a060}}
:root[data-theme="dark"]{--bg:#1c1712;--fg:#f1e8dc;--card:#272019;--mut:#a89886;--bd:#3a3026;--ac:#e0a060}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0 .6em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 2px}
select,input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;max-width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:140px}
.m{color:var(--mut);font-size:.9rem}.day{font-weight:600;margin:10px 0 2px;color:var(--ac)}
.it{display:flex;gap:8px;padding:2px 0}.it b{min-width:48px;font-variant-numeric:tabular-nums}
.gap{color:var(--mut);background:var(--bg);border-radius:6px;padding:2px 6px;margin:2px 0}
h2{font-size:1.05rem;margin:0 0 4px}details{margin-top:8px}
.card>summary,#startCard>summary,#recipeCard>summary{font-size:1.05rem;font-weight:700;cursor:pointer}
.abs{display:flex;gap:8px;align-items:center;margin:4px 0;flex-wrap:wrap}
.abs input{flex:1;min-width:150px}
button.rm{background:none;border:1px solid var(--bd);color:var(--mut);border-radius:6px;width:28px;height:28px;cursor:pointer;flex:0 0 auto}
button.add{margin:6px 0 4px;background:none;border:1px dashed var(--bd);color:var(--ac);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
button.pick,button.done,button.reset{font:inherit;border-radius:8px;padding:8px 14px;cursor:pointer}
button.pick{background:var(--ac);color:#fff;border:none;margin-top:10px}
button.done{background:var(--ac);color:#fff;border:none}
button.reset{background:none;border:1px solid var(--bd);color:var(--mut)}
.next{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.late{color:#c0392b}
.fgap{margin-top:20px}
.rowtoggle{background:none;border:1px solid var(--bd);border-radius:6px;width:24px;height:24px;color:var(--mut);cursor:pointer;margin-left:auto;flex:0 0 auto}
a.compresslink{color:var(--ac)}
.kphase{display:flex;gap:6px;align-items:center;margin:4px 0;flex-wrap:wrap}
.kphase input[type=text]{flex:2;min-width:140px}
.kphase input[type=number]{width:55px}
#chatLog{max-height:260px;overflow-y:auto;margin:8px 0}
.msg{border-radius:10px;padding:8px 10px;margin:6px 0;max-width:88%;white-space:pre-wrap}
.msg.user{background:var(--ac);color:#fff;margin-left:auto}
.msg.assistant{background:var(--bg);border:1px solid var(--bd)}
</style></head><body><main>
<h1>🍞 Планировщик хлеба на закваске</h1>
<div class="card" id="chatCard" style="display:none">
<h2>🤖 Спросить помощника</h2>
<div id="chatLog"></div>
<div class="row"><input id="chatIn" placeholder="Хочу хлеб к 9 утра, ухожу с 14 до 17…" style="flex:1"><button type="button" id="chatSend" class="pick" style="margin:0">Спросить</button></div>
</div>
<details class="card" id="recipeCard"><summary>Рецепты</summary>
<div id="myRecipes"></div>
<h2 style="margin-top:14px" id="formTitle">Добавить рецепт</h2>
<div class="row"><div><label>Название</label><input id="nName" placeholder="Например: Тартин"></div>
<div><label>Опара/закваска, г</label><input id="nN" type="number" min="1"></div></div>
<div class="row"><div><label>Аутолиз</label><div style="display:flex;gap:6px;align-items:center"><input id="nAutH" type="number" min="0" style="width:60px" placeholder="ч"><span class="m">ч</span><input id="nAutM" type="number" min="0" max="59" style="width:60px" placeholder="мин"><span class="m">мин</span></div></div>
<div><label>Брожение</label><div style="display:flex;gap:6px;align-items:center"><input id="nBulkH" type="number" min="0" style="width:60px" placeholder="ч"><span class="m">ч</span><input id="nBulkM" type="number" min="0" max="59" style="width:60px" placeholder="мин"><span class="m">мин</span></div></div></div>
<div class="row"><div><label>Складываний · через сколько минут</label><div style="display:flex;gap:6px"><input id="nFc" type="number" min="0" style="width:70px" placeholder="раз"><input id="nFe" type="number" min="1" style="width:90px" placeholder="мин"></div></div></div>
<label>Ингредиенты, которые соединяются в начале (без опары — она добавится сама)</label>
<div id="ingCList"></div><button type="button" class="add" id="ingCAdd">+ ингредиент</button>
<label style="margin-top:10px">Этапы замеса (необязательно: что добавить и сколько минут месить после этого)</label>
<div id="kneadList"></div><button type="button" class="add" id="kneadAdd">+ этап замеса</button>
<div class="m" id="kneadTotal"></div>
<label style="margin-top:10px">Краткий процесс по шагам (необязательно, для справки)</label>
<textarea id="nText" rows="4" style="width:100%;font:inherit;background:var(--bg);color:inherit;border:1px solid var(--bd);border-radius:8px;padding:6px 8px"></textarea>
<div class="m">Предформовка, формовка, расстойка и выпечка берутся такими же, как у остальных рецептов на закваске.</div>
<div class="row" style="margin-top:6px"><button type="button" class="pick" id="nAdd">Сохранить рецепт</button><button type="button" class="reset" id="nCancelEdit" style="display:none">Отменить редактирование</button></div>
<div class="m" id="nMsg"></div>
<div class="row" style="margin-top:14px"><button type="button" class="reset" id="nExport">Скачать копию рецептов</button><button type="button" class="reset" id="nImportBtn">Загрузить из файла</button><input type="file" id="nImportFile" accept="application/json" style="display:none"></div>
</details>
<details class="card" id="startCard"><summary>Уже начала печь без расчёта? <span style="font-weight:400">Продолжить с текущего этапа</span></summary>
<div><label>Хлеб</label><select id="scRc"></select></div>
<div><label>На каком этапе я сейчас</label><select id="scCk"></select></div>
<div><label>Когда это сделала</label><input type="datetime-local" id="scAt"></div>
<div><label>Расстойка (если уже решили)</label><select id="scPm"><option value="room">комнатная</option><option value="f8">холодильник 8 °C</option><option value="f4">холодильник 4 °C</option></select></div>
<button type="button" class="pick" id="scGo">Рассчитать дальше</button>
<div class="m" id="scMsg"></div>
</details>
<div class="card" id="plannerCard">
<h2>Подобрать расписание</h2>
<div class="row"><div><label>Хлеб</label><select id="rc"></select></div></div>
<div class="row fgap" style="gap:16px;align-items:center">
<label style="display:flex;align-items:center;gap:6px;margin:0"><input type="radio" name="mode" value="target" id="modeTarget" checked>К определённому времени</label>
<label style="display:flex;align-items:center;gap:6px;margin:0"><input type="radio" name="mode" value="now" id="modeNow">Готова начать прямо сейчас, неважно когда будет готов</label>
</div>
<div class="row fgap" id="tgWrap"><div><label>Хочу готовый хлеб (конец выпечки)</label><input type="datetime-local" id="tg"></div></div>
<div id="nbSlotTarget"></div>
<div class="fgap" id="absBlock"><div id="nbSlotNow"></div><label>Периоды, когда меня не будет</label>
<div id="absList"></div>
<button type="button" id="absAdd" class="add">+ добавить период</button></div>
<div class="fgap"><label>Не занимаюсь хлебом</label><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="m">с</span><input type="time" id="q1" value="23:00"><span class="m">до</span><input type="time" id="q2" value="07:00"></div></div>
<div class="row fgap" id="nbRow"><div><label id="nbLabel">Могу начать не раньше</label><input type="datetime-local" id="nb"></div></div>
</div>
<div id="out"></div>
<script>
const M=60000,$=i=>document.getElementById(i);
let ABS=[];
function absRow(it,i){const w=document.createElement('div');w.className='abs';
 w.innerHTML='<input type="datetime-local" value="'+it.s+'"><span class="m">–</span><input type="datetime-local" value="'+it.e+'"><button type="button" class="rm" title="Удалить">✕</button>';
 const[i1,i2]=w.querySelectorAll('input'),rm=w.querySelector('button');
 i1.oninput=()=>{it.s=i1.value;render()};i2.oninput=()=>{it.e=i2.value;render()};
 rm.onclick=()=>{ABS=ABS.filter(x=>x!==it);renderAbs();render()};
 return w}
function renderAbs(){const c=$('absList');c.innerHTML='';ABS.forEach((it,i)=>c.appendChild(absRow(it,i)))}
function defRange(h0,m0,h1,m1){const d=new Date();d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0);
 const s=new Date(d);s.setHours(h0,m0||0,0,0);const e=new Date(d);e.setHours(h1,m1||0,0,0);
 const f=x=>{const z=n=>String(n).padStart(2,'0');return x.getFullYear()+'-'+z(x.getMonth()+1)+'-'+z(x.getDate())+'T'+z(x.getHours())+':'+z(x.getMinutes())};
 return{s:f(s),e:f(e)}}
const R={wheat:{N:120,bulk:210,fold:[4,40],knead:8,aut:45,flax:0,combineNote:'Соединить: вода 360 г + мука пшеничная 500 г + мука ц/з 100 г + опара 120 г = 1080 г',kneadNote:' (3 мин, соль 12 г, ещё 5 мин)',pr:{room:[120,150],f8:[540,660],f4:[1020,1140]}},
flax:{N:300,bulk:165,fold:[2,50],knead:11,aut:60,flax:1,combineNote:'Соединить: вода 240 г + мука пшеничная 575 г + мука ц/з 60 г + опара 300 г + мочка (вся) 290 г = 1465 г',pr:{room:[120,120],f8:[540,660],f4:[1020,1140]}},
malt_bread:{N:160,bulk:225,fold:[6,30],knead:11,aut:60,scald:1,combineNote:'Соединить: вода1 290 г + мука пшеничная 635 г + опара 160 г + заварка (вся) 316 г = 1401 г',kneadNote:' (3-5 мин, вода2 23 г и соль 17 г в 2 захода, ещё 6-7 мин)',pr:{room:[60,180],f8:[540,660],f4:[1020,1140]}}};
const STDPR={room:[120,150],f8:[540,660],f4:[1020,1140]};
const PRFLAT2={room:[120,120],f8:[540,660],f4:[1020,1140]};
const PRUNTIL2={room:[60,180],f8:[540,660],f4:[1020,1140]};
const PRPICK={wheat:STDPR,flat2:PRFLAT2,until2:PRUNTIL2};
const RTXT={
 wheat:'Пшеничный с ц/з мукой (1 большая или 2 маленькие буханки)\nОпара 120 г · Вода 360 г · Мука пшеничная 500 г · Мука ц/з 100 г · Соль 12 г\n\n1. Вода+мука+опара, автолиз 45 мин\n2. Замес 3 мин, соль, ещё 5 мин\n3. Брожение 3,5 ч, 4 складывания каждые 40 мин\n4. Предформовка, отдых 15 мин, формовка\n5. Расстойка: комн. 2-2,5ч / 8° до 10ч / 4° до 18ч\n6. Духовка 250°, разогрев 1ч (формовой — 30 мин)\n7. Выпечка 15 мин при 250°, затем 15-20 мин при 230°\n8. Остудить на решётке',
 flax:'Хлеб с семенами льна (2 буханки)\nМочка: семена льна 75 г + вода 215 г (обжарить, залить, 3-12ч)\nОпара 300 г · Вода 240 г · Мука пшеничная 575 г · Мука ц/з 60 г · Соль 17 г · Мёд 40 г\n\n1. Вода+мочка+мука+опара, автолиз 1ч\n2. Замес 2 мин, мёд, 5 мин, соль, ещё 3-5 мин\n3. Брожение 2,5-3ч, 2 складывания каждые 50 мин\n4. Предформовка, отдых 15 мин, формовка\n5. Расстойка: комн. 2ч / 8° до 10ч / 4° до 18ч\n6. Духовка 250°, разогрев 1ч (формовой — 30 мин)\n7. Выпечка 15 мин при 250°, затем 15-20 мин при 230°\n8. Остудить на решётке',
 malt_bread:'Солодовый хлеб (2 буханки)\nЗаварка: ржаная мука 35г + тёмный солод 58г + кипяток 215г, перемешать, добавить белый солод 8г при температуре не выше 70°C (2-3ч или на ночь, накрыв полотенцем)\nОпара 160 г · Вода1 290 г · Мука пшеничная 635 г · вся заварка · Вода2 23 г · Соль 17 г\n\n1. Вода1+заварка+мука+опара, автолиз 1ч\n2. Замес 3-5 мин, вода2+соль в 2 захода, ещё 6-7 мин\n3. Брожение 3,5-4ч, 5-6 складываний каждые 30 мин\n4. Предформовка, отдых 15 мин, формовка\n5. Расстойка: комн. до 2ч / 8° до 10ч / 4° до 18ч\n6. Духовка 250°, разогрев 1ч (формовой — 30 мин)\n7. Выпечка 15 мин при 250°, затем 15-20 мин при 230°\n8. Остудить на решётке'
};
const PL={room:'комнатная',f8:'холодильник 8 °C',f4:'холодильник 4 °C'};
const RNAME={wheat:'🍞 Пшеничный хлеб с ц/з',flax:'🌾 Хлеб с льном',malt_bread:'🌑 Солодовый хлеб'};
const CKLABEL={levain_made:'Приготовила опару',levain_taken:'Переложила опару в тесто',combine:'Смешала воду, муку и опару',knead:'Замесила тесто',scald_done:'Заварка настояна',soak_start:'Залила семена льна водой',fold_1:'Складка №1',fold_2:'Складка №2',fold_3:'Складка №3',fold_4:'Складка №4',fold_5:'Складка №5',fold_6:'Складка №6',preshape:'Сделала предформовку',shape:'Сформовала',fridge_move:'Убрала в холодильник',bake_start:'Загрузила в духовку'};
function ckList(rcId){const rc=R[rcId];if(!rc)return[];const l=['levain_made','levain_taken'];if(rc.scald)l.push('scald_done');if(rc.flax)l.push('soak_start');l.push('combine','knead');
 for(let i=1;i<=rc.fold[0];i++)l.push('fold_'+i);l.push('preshape','shape','fridge_move','bake_start');return l}
const LV={night:{r:10,step:1,rng:[600,720],lb:'долгая 1:10:10 (10–12 ч)'},day:{r:2,step:5,rng:[300,360],lb:'короткая 1:2:2 (5–6 ч)'}};
function levain(N,m){const k=1+2*m.r,s=Math.ceil((N+10)/k/m.step-1e-9)*m.step;return{s,f:s*m.r,t:s*k}}
function build(rc,pm,P,lm,L,T){
 let ic=0;const A=[],S=[],a=(t,d,l,x,key)=>A.push({id:'a'+(ic++),s:t,e:t+d*M,l,x,key}),st=(s,e,x)=>S.push({s,e,x});
 const bs=T-33*M;a(bs,5,'r','Переложить на пергамент, сделать надрезы, сбрызнуть водой и загрузить','bake_start');a(bs+15*M,2,'y','Снизить до 230 °C');a(T-2*M,2,'y','Достать хлеб');st(bs,T,'выпечка');
 a(bs-60*M,2,'y','Включить духовку (разогрев до 250 °C)');
 let c=bs-P*M;st(c,bs,'расстойка: '+PL[pm]);if(pm!='room')a(c,5,'y','Убрать тесто в холодильник','fridge_move');
 c-=10*M;a(c,10,'r','Формовка','shape');c-=15*M;st(c,c+15*M,'отдых теста');c-=10*M;a(c,10,'r','Предформовка','preshape');
 const b0=c-rc.bulk*M;st(b0,c,'брожение');for(let i=1;i<=rc.fold[0];i++)a(b0+i*rc.fold[1]*M,2,'y','Складка №'+i,'fold_'+i);c=b0;
 c-=rc.knead*M;a(c,rc.knead,'r','Замес'+(rc.flax?' (2 мин, мёд 40 г, 5 мин, соль 17 г, ещё 3–5 мин)':(rc.kneadNote||'')),'knead');
 c-=rc.aut*M;const autStart=c;st(c,c+rc.aut*M,'аутолиз');if(rc.extraAction)a(autStart+(rc.extraAction.offsetMin||0)*M,2,'y',rc.extraAction.title);c-=5*M;a(c,5,'r',rc.combineNote||('Соединить воду, муку, опару'+(rc.flax?' и мочку льна':'')),'combine');const cs=c;
 const lv=levain(rc.N,LV[lm]);c-=3*M;a(c,3,'y','Забрать '+rc.N+' г опары в тесто; из остатка взять 10 г и покормить 1:5:5 (10+50+50 г)','levain_taken');
 const le=c;c-=L*M;st(c,le,'опара созревает');a(c,5,'r','Приготовить опару: закваска '+lv.s+' г + мука '+lv.f+' г + вода '+lv.f+' г = '+lv.t+' г','levain_made');
 if(rc.flax){const ss=c;st(ss,cs,'мочка льна');a(ss,2,'r','Залить семена льна (75 г) водой (215 г)','soak_start');st(ss-15*M,ss,'семена остывают');a(ss-20*M,5,'r','Обжарить семена льна 75 г на сухой сковороде (5 мин)')}
 if(rc.scald){const ss=cs-150*M;st(ss,cs,'заварка настаивается');a(ss,5,'r','Заварка: ржаная мука 35 г + тёмный солод 58 г + кипяток 215 г, затем белый солод 8 г (при ≤70 °C)','scald_done')}
 A.sort((x,y)=>x.s-y.s);
 return{A,S,start:Math.min(...A.map(x=>x.s),...S.map(x=>x.s)),T}
}
function blocks(T,fwd){const o=[],g=(id)=>$(id).value,d0=new Date(T);d0.setHours(0,0,0,0);
 const mk=(d,t)=>{const[h,m]=t.split(':');const x=new Date(d);x.setHours(+h,+m,0,0);return x.getTime()};
 if(!fwd&&g('nb'))o.push({s:0,e:new Date(g('nb')).getTime(),w:'это раньше времени, с которого вы можете начать'});
 for(const it of ABS)if(it.s&&it.e)o.push({s:new Date(it.s).getTime(),e:new Date(it.e).getTime(),w:'вы отсутствуете'});
 const range=fwd?[0,1,2,3]:[-5,-4,-3,-2,-1,0];
 for(const i of range){const d=new Date(d0);d.setDate(d.getDate()+i);
  if(g('q1')&&g('q2')){const n=new Date(d);n.setDate(n.getDate()+1);o.push({s:mk(d,g('q1')),e:mk(n,g('q2')),w:'время, когда вы не занимаетесь хлебом'})}}
 return o}
const tm=t=>new Date(t).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}),
dy=t=>new Date(t).toLocaleDateString('ru',{weekday:'short',day:'numeric',month:'long'}),
dur=m=>Math.floor(m/60)+' ч'+(m%60?' '+m%60+' мин':''),
durShort=m=>{const h=Math.floor(m/60),mm=m%60;return h?(h+' ч'+(mm?' '+mm+' мин':'')):(mm+' мин')};
function metrics(v){let gap=null,act=0,mx=v.A[0].e;for(const x of v.A){act+=(x.e-x.s)/M;if(x.s>mx){const g={s:mx,e:x.s};if(!gap||g.e-g.s>gap.e-gap.s)gap=g}mx=Math.max(mx,x.e)}
 return{act,gap:gap?(gap.e-gap.s)/M:0,span:(v.T-v.start)/M}}
function plan(){
 const rcId=$('rc').value,T=new Date($('tg').value).getTime(),rc=R[rcId],X=blocks(T),ok=[],no=[];
 for(const pm in rc.pr)for(const lm in LV){let best=null,worst=null;
  const[p0,p1]=rc.pr[pm],[l0,l1]=LV[lm].rng;
  for(let P=p0;P<=p1;P+=30)for(let L=l0;L<=l1;L+=30){
   const v=build(rc,pm,P,lm,L,T),bad=[];
   for(const it of v.A){const w=X.find(w=>it.s<w.e&&it.e>w.s);if(w)bad.push(it.x+' в '+tm(it.s)+' ('+w.w+')')}
   const mt=metrics(v);v.mt=mt;v.pm=pm;v.lm=lm;v.P=P;v.L=L;
   if(!bad.length){if(!best||mt.gap>best.mt.gap)best=v}else if(!worst||bad.length<worst.bad.length){v.bad=bad;worst=v}}
  if(best)ok.push(best);else no.push({pm,lm,bad:worst.bad})}
 ok.sort((x,y)=>y.mt.gap-x.mt.gap);return{ok:ok.slice(0,3),no,rc,rcId}}
function planForward(){
 const rcId=$('rc').value,rc=R[rcId],start=new Date($('nb').value).getTime();
 if(!start||isNaN(start))return{ok:[],no:[],rc,rcId,noStart:true};
 const X=blocks(start,true),ok=[],no=[];
 for(const pm in rc.pr)for(const lm in LV){let best=null,worst=null;
  const[p0,p1]=rc.pr[pm],[l0,l1]=LV[lm].rng;
  for(let P=p0;P<=p1;P+=30)for(let L=l0;L<=l1;L+=30){
   const v0=build(rc,pm,P,lm,L,0),delta=start-v0.start;
   const v={A:v0.A.map(x=>Object.assign({},x,{s:x.s+delta,e:x.e+delta})),S:v0.S.map(x=>Object.assign({},x,{s:x.s+delta,e:x.e+delta})),start,T:v0.T+delta,pm,lm,P,L},bad=[];
   for(const it of v.A){const w=X.find(w=>it.s<w.e&&it.e>w.s);if(w)bad.push(it.x+' в '+tm(it.s)+' ('+w.w+')')}
   const mt=metrics(v);v.mt=mt;
   if(!bad.length){if(!best||v.T<best.T)best=v}else if(!worst||bad.length<worst.bad.length){v.bad=bad;worst=v}}
  if(best)ok.push(best);else no.push({pm,lm,bad:worst.bad})}
 ok.sort((x,y)=>x.T-y.T);return{ok:ok.slice(0,3),no,rc,rcId}}
function card(v,i,rc,rcId){const{A,S,mt}=v,lv=levain(rc.N,LV[v.lm]);

 let dk='',mx=A[0].e;
 for(const x of A){if(x.s-mx>=60*M){const mid=(mx+x.s)/2,s=S.find(z=>z.s<=mid&&z.e>=mid);
   h+='<div class="gap">🟢 '+tm(mx)+'–'+tm(x.s)+' · свободно'+(s?' ('+s.x+')':'')+'</div>'}
  const k=dy(x.s);if(k!=dk){h+='<div class="day">'+k+'</div>';dk=k}
  h+='<div class="it"><b>'+tm(x.s)+'</b><span>'+(x.l=='r'?'🔴':'🟡')+' '+x.x+'</span></div>';mx=Math.max(mx,x.e)}
 h+='<div class="it m"><b>'+tm(v.T)+'</b><span>✅ Хлеб готов (остывание на решётке ~1 ч)</span></div>';

function loadSession(){try{return JSON.parse(localStorage.getItem('bps_session'))}catch(e){return null}}
const FLEXKEYS=['levain_made','scald_done','soak_start'];
function saveUndo(sess){try{localStorage.setItem('bps_session_undo',JSON.stringify(sess))}catch(e){}}
function markDone(id,now,force){
 now=now||Date.now();
 const sess=loadSession();if(!sess)return;
 const act=sess.actions.find(a=>a.id===id);if(!act)return;
 saveUndo(sess);
 const origS=act.s,delta=now-origS;
 if(!force&&FLEXKEYS.includes(act.key)&&delta<=0){
  act.status='done';act.actual=now;act.s=now;act.e=now;
  localStorage.setItem('bps_session',JSON.stringify(sess));render();return}
 act.status='done';act.actual=now;act.s=now;act.e=now;
 for(const a of sess.actions)if(a.id!==id&&a.s>origS){a.s+=delta;a.e+=delta}
 for(const s of sess.stages){if(s.s>origS)s.s+=delta;if(s.e>origS)s.e+=delta}
 sess.T+=delta;
 localStorage.setItem('bps_session',JSON.stringify(sess));render()}
function delayAction(id,mins){
 const sess=loadSession();if(!sess)return;
 const act=sess.actions.find(a=>a.id===id);if(!act)return;
 saveUndo(sess);
 const delta=mins*M,origS=act.s;act.s+=delta;act.e+=delta;
 for(const a of sess.actions)if(a.id!==id&&a.s>origS){a.s+=delta;a.e+=delta}
 for(const s of sess.stages){if(s.s>origS)s.s+=delta;if(s.e>origS)s.e+=delta}
 sess.T+=delta;localStorage.setItem('bps_session',JSON.stringify(sess));render()}
function compressAfterDelay(id,now){
 now=now||Date.now();
 const sess=loadSession();if(!sess)return;
 const act=sess.actions.find(a=>a.id===id);if(!act)return;
 const origS=act.s,delta=now-origS;
 if(delta<=0){markDone(id,now);return}
 saveUndo(sess);
 const rc=R[sess.rcId],minP=rc.pr[sess.pm][0]*M;
 const proof=sess.stages.find(s=>s.x.indexOf('расстойка')===0);
 if(!proof||proof.e<=origS){markDone(id,now,true);return}
 const oS=proof.s,oE=proof.e,curDur=oE-oS,avail=Math.max(curDur-minP,0);
 const compress=Math.min(delta,avail),remainder=delta-compress;
 act.status='done';act.actual=now;act.s=now;act.e=now;
 for(const a of sess.actions){if(a.id===id)continue;
  if(a.s>origS&&a.s<oE){a.s+=delta;a.e+=delta}
  else if(a.s>=oE){a.s+=remainder;a.e+=remainder}}
 for(const s of sess.stages){
  if(s===proof){s.s+=delta;s.e=s.s+curDur-compress}
  else if(s.s>origS&&s.s<oE){s.s+=delta;s.e+=delta}
  else if(s.s>=oE){s.s+=remainder;s.e+=remainder}}
 sess.T+=remainder;localStorage.setItem('bps_session',JSON.stringify(sess));render();
 return remainder}

function dtVal(ms){const d=new Date(ms),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes())}

   mx=Math.max(mx,p.e)}
  h+='<div class="it m"><b>'+tm(sess.T)+'</b><span>✅ Хлеб готов (остывание ~1 ч)</span></div>';
 } else h+='<div class="m" style="margin-top:8px">Все действия выполнены. Хлеб готов!</div>';
 h+='<div class="row" style="gap:8px;margin-top:14px"><button type="button" class="reset endbtn">Начать заново</button>'+(localStorage.getItem('bps_session_undo')?'<button type="button" class="reset undobtn">Отменить последнее действие</button>':'')+'</div></div>';
 $('out').innerHTML=h;

function render(){

function startFromCheckpoint(rcId,ck,atMs,pmId){
 const rc=R[rcId];if(!rc)return{error:'неизвестный рецепт'};
 const pm=pmId||'room';if(!rc.pr[pm])return{error:'неизвестный режим расстойки'};
 const[p0,p1]=rc.pr[pm],P=Math.round((p0+p1)/2),v=build(rc,pm,P,'day',270,0);
 const node=v.A.find(x=>x.key===ck);
 if(!node)return{error:'неизвестная контрольная точка "'+ck+'"'};
 const delta=atMs-node.s;
 const sess={rcId,pm,lm:'day',T:v.T+delta,
  actions:v.A.map(x=>({id:x.id,x:x.x,l:x.l,s:x.s+delta,e:x.e+delta,key:x.key,status:x.s<=node.s?'done':'pending'})),
  stages:v.S.map(s=>({s:s.s+delta,e:s.e+delta,x:s.x}))};
 localStorage.setItem('bps_session',JSON.stringify(sess));render();
 return{ok:true,proof:PL[pm],ready_iso:new Date(sess.T).toISOString()}}
